name: Deploy to GitHub Pages

# 每次 push 到 main 就自動部署整個網站
on:
  push:
    branches: [main]
  workflow_dispatch:      # 也可在 Actions 頁手動觸發

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，新的推送會取代進行中的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .          # 專案根目錄即為網站

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
